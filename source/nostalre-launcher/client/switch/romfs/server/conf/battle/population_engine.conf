// RagSWITCH population preset: enabled on the next packaged version.
// 50 is a GLOBAL ceiling, never fifty per unloaded map.
// Override here or in conf/import/battle_conf.txt, then restart the game.
population_engine_enable: on
population_engine_max_count: 50
// Cities use max_count (50); fields and dungeons use this smaller target.
population_engine_target_per_map: 20
population_engine_demand_spawn: on
population_engine_demand_grace_ms: 0
population_engine_autosummon_batch_size: 5
population_engine_density_pct: 100
population_engine_level_from_map: on
population_engine_equipment_strict_load: off

// Only nearby shells fight; five combat evaluations a second.
population_engine_shell_timer_ms: 200
population_engine_shell_skill_interval_ms: 4000
population_engine_shell_attack_skill_delay_ms: 2000
population_engine_shell_mobtracker_interval_ms: 800
population_engine_shell_detection_cache_ms: 800
population_engine_shell_mdetection_cells: 14
population_engine_shell_basic_attack_chance: 85
population_engine_ai: 0x3D2
population_engine_shell_attackskill: on

// Stagger ambient walking. Never start more than ten paths in one tick.
population_engine_wander_enable: on
population_engine_wander_tick_ms: 500
population_engine_wander_max_per_tick: 3
population_engine_wander_cooldown_ms: 20000
population_engine_wander_cooldown_jitter_ms: 70000
population_engine_path_attempts: 8

// Keep conversations infrequent and towns active at any playing hour.
population_engine_chat_enable: on
population_engine_chat_tick_ms: 3000
population_engine_chat_cooldown_ms: 240000
population_engine_chat_cooldown_jitter_ms: 180000
population_engine_chat_max_per_tick: 1
population_engine_chat_reply_enable: on
population_engine_daily_cycle: off

// Classic towns: bounded static consumables only; dynamic drop vendors are disabled.
population_engine_vending_enable: on
population_engine_arena_custom_pool: off
